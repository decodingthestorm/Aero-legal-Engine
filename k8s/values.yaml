api:
  image:
    repository: ghcr.io/example/legal-engine/api
    tag: latest
  replicaCount: 2
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  image:
    repository: ghcr.io/example/legal-engine/worker
    tag: latest
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

ui:
  image:
    repository: ghcr.io/example/legal-engine/ui
    tag: latest
  replicaCount: 2
  port: 3000
  apiBaseUrl: https://legal-engine.example.com/api
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  host: legal-engine.example.com
  tls:
    enabled: true
    secretName: legal-engine-tls
