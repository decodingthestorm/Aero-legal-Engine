{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legal-engine-ingress
spec:
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # /api must come before / (a Prefix match on / would otherwise
          # shadow it): the API service, matching .Values.ui.apiBaseUrl's
          # default of https://<host>/api baked into the ui image at build
          # time (see docker/Dockerfile.ui).
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: legal-engine-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legal-engine-ui
                port:
                  number: 80
{{- end }}
