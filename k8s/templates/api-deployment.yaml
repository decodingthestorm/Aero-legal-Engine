apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-engine-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: legal-engine-api
  template:
    metadata:
      labels:
        app: legal-engine-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports:
            - containerPort: {{ .Values.api.port }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: legal-engine-api
spec:
  selector:
    app: legal-engine-api
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
