name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,api,workers]"

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Integration tests
        run: pytest tests/integration -v

      - name: Property tests
        run: pytest tests/property -v

  postgres:
    runs-on: ubuntu-latest
    # persistence/sql_repository.py is tested against SQLite in the `test`
    # job above (tests/unit/test_sql_repository.py — there's no Postgres
    # available in the environment this was developed in), which covers
    # most of its behavior honestly but can't prove anything asyncpg- or
    # Postgres-specific (UUID column mapping in particular). This job runs
    # tests/integration/test_postgres_repository.py against a genuine
    # Postgres service container — the actual verification that gap needs,
    # even though it never runs locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: legal_engine
          POSTGRES_PASSWORD: legal_engine
          POSTGRES_DB: legal_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,postgres]"

      - name: Postgres integration tests
        env:
          LEGAL_ENGINE_TEST_POSTGRES_DSN: postgresql+asyncpg://legal_engine:legal_engine@localhost:5432/legal_engine_test
        run: pytest tests/integration/test_postgres_repository.py -v

  ui:
    runs-on: ubuntu-latest
    # Fast check: does it compile and type-check. The `e2e` job below is
    # the one that actually proves the app behaves correctly in a browser.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build (includes TypeScript type-checking)
        working-directory: ui
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # ui/ was manually verified once in a real browser against a live API
    # (see README.md's "Known limitations") — a one-time human pass, not a
    # repeatable check. This job runs the actual Playwright suite
    # (ui/e2e/*.spec.ts) end-to-end on every push: real UI, real API, real
    # HTTP requests, including the error-path coverage (API down mid-
    # request, a request 400s/500s) that manual pass never covered.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -e ".[dev,api,workers]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ui
        run: npm run test:e2e
