name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,api,workers]"

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Integration tests
        run: pytest tests/integration -v

      - name: Property tests
        run: pytest tests/property -v

  ui:
    runs-on: ubuntu-latest
    # ui/ has been manually verified once (npm install + npm run dev +
    # exercising all three components in a real browser against a live
    # API) — see README.md's "Known limitations". This job is the
    # repeatable regression check going forward: it doesn't replicate that
    # manual browser pass, but it does catch anything that stops compiling.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build (includes TypeScript type-checking)
        working-directory: ui
        run: npm run build
