name: CI

on:
  push:
    # Both names on purpose. This repo's branch is `master`, and listing
    # only `main` meant CI never fired once across twelve releases — the
    # workflow existed, looked configured, and was never a gate. Listing
    # both survives a future default-branch rename rather than trading one
    # silent no-op for another.
    branches: [main, master]
  pull_request:
  # Manual trigger, so "has this ever actually run?" is answerable without
  # pushing a commit to find out.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # sparse-opt (cvxpy) is included here, not just left to skip
        # everywhere: it fails to import in the Windows environment this
        # was developed in (see refactoring/sparse_optimizer.py's module
        # docstring — an Application Control policy blocks a native DLL
        # several layers into its import chain), which is a Windows-
        # specific problem this Ubuntu runner doesn't have, so this is
        # where tests/unit/test_sparse_optimizer.py's real-computation
        # tests actually get to run for real instead of skipping. kms
        # (boto3/hvac) is included so those packages' own installability
        # is verified for real here too — core/key_signer.py's
        # AwsKmsKeySigner/VaultTransitKeySigner tests use injected mock
        # clients regardless of whether boto3/hvac are installed, so this
        # isn't required for them to pass, just for the install itself to
        # be checked.
        run: pip install -e ".[dev,api,workers,sparse-opt,kms]"

      - name: Lint
        run: ruff check src tests

      # Strict mode. Only src/ — the test suite leans on pytest fixtures
      # and monkeypatching that strict mode would fight without catching
      # anything real. python_version is deliberately unpinned in
      # pyproject.toml, so this run targets the 3.11 set up above, which
      # is the version requires-python actually promises.
      - name: Type check
        run: mypy src/legal_engine

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Integration tests
        run: pytest tests/integration -v

      - name: Property tests
        run: pytest tests/property -v

  postgres:
    runs-on: ubuntu-latest
    # persistence/sql_repository.py is tested against SQLite in the `test`
    # job above (tests/unit/test_sql_repository.py — there's no Postgres
    # available in the environment this was developed in), which covers
    # most of its behavior honestly but can't prove anything asyncpg- or
    # Postgres-specific (UUID column mapping in particular). This job runs
    # tests/integration/test_postgres_repository.py against a genuine
    # Postgres service container — the actual verification that gap needs,
    # even though it never runs locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: legal_engine
          POSTGRES_PASSWORD: legal_engine
          POSTGRES_DB: legal_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,postgres]"

      # Both SQL-backed repositories. The user repository was added later
      # and went uncovered here for several releases, so it ran against
      # SQLite only — including list_by_tenant/remove, which back member
      # management. Match this pattern for any future SQL-backed store.
      - name: Postgres integration tests
        env:
          LEGAL_ENGINE_TEST_POSTGRES_DSN: postgresql+asyncpg://legal_engine:legal_engine@localhost:5432/legal_engine_test
        run: |
          pytest tests/integration/test_postgres_repository.py \
                 tests/integration/test_postgres_user_repository.py -v

  ui:
    runs-on: ubuntu-latest
    # Fast check: does it compile and type-check. The `e2e` job below is
    # the one that actually proves the app behaves correctly in a browser.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build (includes TypeScript type-checking)
        working-directory: ui
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # ui/e2e/*.spec.ts run against a real UI + real API + real HTTP
    # requests (including error-path coverage — API down mid-request, a
    # request 400s/500s). One matrix job per browser engine (all three
    # Playwright ships: Chromium, Firefox, WebKit) so they run in parallel
    # with independent pass/fail reporting, rather than one long job
    # covering only Chromium.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -e ".[dev,api,workers]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browser (${{ matrix.project }})
        working-directory: ui
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run Playwright tests (${{ matrix.project }})
        working-directory: ui
        run: npx playwright test --project=${{ matrix.project }}
