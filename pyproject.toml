[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-engine"
version = "1.4.1"
description = "Distributed legal ingestion, formal verification, and game-theoretic statutory optimization platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    # Core: used by every subsystem that's actually implemented so far
    # (core/, formal_logic/, game_theory/, refactoring/,
    # knowledge_graph/'s default in-process backends, ingestion/'s polite
    # crawler and parsers). httpx/beautifulsoup4 are hard imports in
    # ingestion/rate_limiter.py and ingestion/parsers/municipal.py — not
    # lazily-loaded optional backends like the ones below — so they belong
    # here rather than behind an extra.
    "z3-solver>=4.12.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    # core/wal.py's entire value proposition is the cryptographic signing —
    # unlike the lazy-imported backends below, there's no meaningful
    # lightweight test double for "the audit log, but unsigned", so this is
    # a hard dependency rather than living behind an extra.
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
# Each of these backs one lazily-imported "real backend" class (see
# knowledge_graph/{graph_service,vector_service,embeddings}.py,
# ingestion/ocr.py) — none of them is required to run the default
# in-process implementations or the test suite. Split out so CI and local
# dev don't pay for a sentence-transformers/torch install (or a Playwright
# browser download) just to run unit tests.
semantic = ["sentence-transformers>=2.5.0"]
vector-qdrant = ["qdrant-client>=1.7.0"]
graph-neo4j = ["neo4j>=5.19.0"]
js-rendering = ["playwright>=1.42.0"]  # not used by any parser yet; httpx covers static HTML/XML
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17.0"]
# The "sql" statute_backend (persistence/sql_repository.py) against a real
# Postgres. sqlalchemy itself is also needed just to run the test suite
# (against SQLite instead — see the `dev` extra), since it's a hard import
# at persistence/sql_repository.py's module level, not lazily deferred like
# the backends above.
postgres = ["sqlalchemy>=2.0.0", "asyncpg>=0.29.0"]
# refactoring/sparse_optimizer.py's L1-sparse patch solver. Deliberately
# excludes MOSEK (the commercial solver some cvxpy examples default to) —
# L1-minimization under linear equality constraints is a linear program,
# fully solvable by cvxpy's bundled open-source solvers, no paid license
# needed.
sparse-opt = ["cvxpy>=1.4.0"]
# core/key_signer.py's AWS KMS / HashiCorp Vault Transit-backed WAL
# signers (settings.wal_signer_backend). Neither is exercised against a
# real AWS account or Vault instance in this environment — see that
# module's docstring for what is and isn't verified here.
kms = ["boto3>=1.34.0", "hvac>=2.1.0"]
# Deployment-role splits, not lazy-import backends: a batch/library-only
# user of formal_logic/game_theory shouldn't need a web framework or task
# queue pulled in. CI installs both to cover api/ and workers/ in tests.
api = ["fastapi>=0.110.0", "uvicorn>=0.28.0"]
workers = ["celery>=5.3.6", "redis>=5.0.1"]
# load_tests/locustfile.py. Not part of `dev` or `all` on purpose - this is
# a tool you run on demand against a live API, not something any test suite
# needs installed.
load-test = ["locust>=2.20.0"]

all = [
    "legal-engine[semantic,vector-qdrant,graph-neo4j,js-rendering,ocr,postgres,sparse-opt,kms,api,workers,load-test]",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    # For tests/unit/test_sql_repository.py: exercises
    # persistence/sql_repository.py for real against SQLite, since there's
    # no Postgres available to test against in this environment. Only
    # asyncpg (not sqlalchemy) is Postgres-specific, so sqlalchemy lives
    # here rather than only in the `postgres` extra.
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Untyped/optional third-party dependencies with no published stubs.
module = ["networkx.*", "z3.*", "neo4j.*", "qdrant_client.*", "sentence_transformers.*"]
ignore_missing_imports = true
