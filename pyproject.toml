[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-engine"
version = "0.1.0"
description = "Distributed legal ingestion, formal verification, and game-theoretic statutory optimization platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "z3-solver>=4.12.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "playwright>=1.42.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.5.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "structlog>=24.1.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# asyncio_mode = "auto"  # re-enable once pytest-asyncio is installed (Phase 3/4)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
