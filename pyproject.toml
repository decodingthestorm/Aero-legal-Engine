[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-engine"
version = "1.16.0"
description = "Distributed legal ingestion, formal verification, and game-theoretic statutory optimization platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    # Core: used by every subsystem that's actually implemented so far
    # (core/, formal_logic/, game_theory/, refactoring/,
    # knowledge_graph/'s default in-process backends, ingestion/'s polite
    # crawler and parsers). httpx/beautifulsoup4 are hard imports in
    # ingestion/rate_limiter.py and ingestion/parsers/municipal.py — not
    # lazily-loaded optional backends like the ones below — so they belong
    # here rather than behind an extra.
    "z3-solver>=4.12.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    # core/wal.py's entire value proposition is the cryptographic signing —
    # unlike the lazy-imported backends below, there's no meaningful
    # lightweight test double for "the audit log, but unsigned", so this is
    # a hard dependency rather than living behind an extra.
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
# Each of these backs one lazily-imported "real backend" class (see
# knowledge_graph/{graph_service,vector_service,embeddings}.py,
# ingestion/ocr.py) — none of them is required to run the default
# in-process implementations or the test suite. Split out so CI and local
# dev don't pay for a sentence-transformers/torch install (or a Playwright
# browser download) just to run unit tests.
semantic = ["sentence-transformers>=2.5.0"]
vector-qdrant = ["qdrant-client>=1.7.0"]
graph-neo4j = ["neo4j>=5.19.0"]
js-rendering = ["playwright>=1.42.0"]  # not used by any parser yet; httpx covers static HTML/XML
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17.0"]
# The "sql" statute_backend (persistence/sql_repository.py) against a real
# Postgres. sqlalchemy itself is also needed just to run the test suite
# (against SQLite instead — see the `dev` extra), since it's a hard import
# at persistence/sql_repository.py's module level, not lazily deferred like
# the backends above.
postgres = ["sqlalchemy>=2.0.0", "asyncpg>=0.29.0"]
# refactoring/sparse_optimizer.py's L1-sparse patch solver. Deliberately
# excludes MOSEK (the commercial solver some cvxpy examples default to) —
# L1-minimization under linear equality constraints is a linear program,
# fully solvable by cvxpy's bundled open-source solvers, no paid license
# needed.
sparse-opt = ["cvxpy>=1.4.0"]
# core/key_signer.py's AWS KMS / HashiCorp Vault Transit-backed WAL
# signers (settings.wal_signer_backend). Neither is exercised against a
# real AWS account or Vault instance in this environment — see that
# module's docstring for what is and isn't verified here.
kms = ["boto3>=1.34.0", "hvac>=2.1.0"]
# core/timestamper.py's RFC 3161 Time-Stamp Protocol client
# (settings.timestamp_backend). Pure Python with no native extensions,
# unlike the sentence-transformers/cvxpy families — so unlike those, it's
# also in `dev`, and the request-encoding/response-parsing tests run
# against synthetic DER in the normal suite. What's *not* verified here
# is a live TSA, same honesty category as the KMS/Vault signers.
tsp = ["pyasn1>=0.6.0", "pyasn1-modules>=0.4.0"]
# Deployment-role splits, not lazy-import backends: a batch/library-only
# user of formal_logic/game_theory shouldn't need a web framework or task
# queue pulled in. CI installs both to cover api/ and workers/ in tests.
api = ["fastapi>=0.110.0", "uvicorn>=0.28.0"]
workers = ["celery>=5.3.6", "redis>=5.0.1"]
# load_tests/locustfile.py. Not part of `dev` or `all` on purpose - this is
# a tool you run on demand against a live API, not something any test suite
# needs installed.
load-test = ["locust>=2.20.0"]

all = [
    "legal-engine[semantic,vector-qdrant,graph-neo4j,js-rendering,ocr,postgres,sparse-opt,kms,tsp,api,workers,load-test]",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    # For tests/unit/test_sql_repository.py: exercises
    # persistence/sql_repository.py for real against SQLite, since there's
    # no Postgres available to test against in this environment. Only
    # asyncpg (not sqlalchemy) is Postgres-specific, so sqlalchemy lives
    # here rather than only in the `postgres` extra.
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # See the `tsp` extra: pure Python, so the RFC 3161 client's encoding
    # and parsing are covered by the normal test suite rather than being
    # skipped like the KMS/Vault paths.
    "pyasn1>=0.6.0",
    "pyasn1-modules>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
# python_version is deliberately NOT pinned here, unlike ruff's
# target-version above. Pinning it to 3.11 (what requires-python promises
# and what CI runs) makes mypy unrunnable on any newer local interpreter:
# numpy >= 2.5 requires Python >= 3.12 and its stubs use PEP 695 `type`
# statements, which are a *syntax* error under a 3.11 target — and a stub
# syntax error aborts the entire run ("errors prevented further checking")
# before a single first-party file is looked at. It is not suppressible;
# ignore_errors and follow_imports = skip were both tried.
#
# Unpinned, mypy targets whichever interpreter runs it, so both
# environments work and each is self-consistent: CI installs a 3.11-era
# numpy under 3.11 and type-checks against 3.11, which is the run that
# gates merges; a 3.12+ local venv checks against its own version. The
# gap that leaves — code valid on 3.14 but not 3.11 — is caught by CI,
# and ruff's target-version = "py311" already catches the syntax half of
# it locally. A gate nobody can run locally gets discovered only in CI,
# which is how it stops being a gate.

[[tool.mypy.overrides]]
# Untyped/optional third-party dependencies with no published stubs. Every
# one of these is behind a lazy import in a "real backend" class (see
# core/key_signer.py, ingestion/ocr.py, knowledge_graph/*), so mypy can't
# see them at all unless that extra happens to be installed — and the
# default, tested path never installs them.
module = [
    "networkx.*",
    "z3.*",
    "neo4j.*",
    "qdrant_client.*",
    "sentence_transformers.*",
    "boto3.*",
    "botocore.*",
    "hvac.*",
    "pdf2image.*",
    "pytesseract.*",
    "celery.*",
    "pyasn1.*",
    "pyasn1_modules.*",
    "scipy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Neither of these is an ignore_missing_imports case — both are installed
# and both ship (or partially ship) real type information; the problem is
# that following it produces noise about the library rather than about
# this codebase. numpy's stubs are version-sensitive (see the note on
# python_version above) and cvxpy's are incomplete enough that ordinary
# use reports "Module has no attribute" for functions that plainly exist.
# Skipping types both as Any, a real but small loss: numpy and cvxpy are
# used in game_theory/ and refactoring/ for array and convex-program math
# whose shapes mypy was never verifying anyway.
module = ["numpy.*", "cvxpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# celery's @app.task decorator is untyped, so under strict mode it makes
# every task it decorates untyped too — an error about celery's typing,
# not about tasks.py. The task bodies themselves are still fully checked;
# only the "a decorator erased these annotations" complaint is silenced.
module = ["legal_engine.workers.tasks"]
disallow_untyped_decorators = false
